name: Daily Paphos Water Model Update

on:
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:     

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl requests scikit-learn

      - name: Run update_model.py
        run: python update_model.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add public/model_output.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update model output [skip ci]" && git push)